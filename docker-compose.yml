services:
  db:
    image: postgres:16
    container_name: destacai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: destacai
      POSTGRES_PASSWORD: destacai
      POSTGRES_DB: destacai
    ports:
      - "5432:5432"
    volumes:
      - destacai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U destacai -d destacai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  destacai-pgdata:
